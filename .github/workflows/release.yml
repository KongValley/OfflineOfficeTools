name: release

# 正式包只在云端出:推 v* tag 时构建 ia32 zip 并挂到 GitHub Release。
# 本地 `npm run dist` 固定 --publish never,产物只留在 release/ 供自测。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-ia32:
    name: Windows ia32 zip
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # tag 与 package.json 版本必须一致,否则产物文件名会带着另一个版本号挂上 Release
      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $pkg 不一致;先把 version 改成 $tag 再打 tag"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 标准安装:canvas 会作为 pdfjs-dist 的可选依赖被装上,由 electron-builder 的
      # files 排除规则挡在包外;不加 --omit=optional,以免动到 esbuild 的平台包。
      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      # afterPack 会用缓存里的 rcedit 写 exe 图标;云端缓存为空时尽力补一份,
      # 拉取失败不阻断构建(exe 退回 Electron 默认图标,窗口/任务栏图标不受影响)。
      - name: 准备 rcedit(可失败)
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "electron-builder\Cache\rcedit"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v1.1.1/rcedit-x64.exe" -OutFile (Join-Path $dir "rcedit-x64.exe")

      - name: 打包 ia32 zip
        run: npm run dist

      # 依赖里唯一可能混入的原生模块是 pdfjs-dist 的可选 canvas,断言它没被打进包
      - name: 检查包里没有原生二进制
        shell: pwsh
        run: |
          Add-Type -A System.IO.Compression.FileSystem
          $zip = Get-ChildItem release/*.zip | Select-Object -First 1
          $z = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $bad = @($z.Entries | Where-Object { $_.FullName -like "*.node" -or $_.FullName -like "*node_modules/canvas/*" })
          "zip=$($zip.Name) entries=$($z.Entries.Count) natives=$($bad.Count)"
          $z.Dispose()
          if ($bad.Count -gt 0) {
            $bad.FullName
            throw "包内出现原生二进制,检查 electron-builder.yml 的 files 排除"
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: offline-office-tools-ia32
          path: release/*.zip
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
